# yaml-language-server: $schema=https://richardrh.github.io/valet/schema/v1/pipeline.schema.json
name: Test Pipeline
version: "1.0"

# No output URI: validate returns one aggregate JSON summary on stdout.
# Add -o results/ to publish all row buckets, issues and a terminal manifest.

rules:
  # Not null checks on record_id
  - code: RECORD_ID_REQUIRED
    name: Record ID must not be null
    column: record_id
    checks:
      not_null: true
    level: error
    message: "record_id is required"

  # Value range on amount
  - code: AMOUNT_RANGE
    name: Amount should be reasonable
    column: amount
    checks:
      valid_range: {min: 0, max: 10000000}
    level: error
    message: "amount must be between 0 and 10,000,000"

  # Location should not be null
  - code: LOCATION_REQUIRED
    name: Location is required
    column: location
    checks:
      not_null: true
    level: warn

  # Amount should be positive
  - code: POSITIVE_AMOUNT
    name: Amount must be positive
    column: amount
    checks:
      valid_range: {min: 0}
    level: error
    message: "amount must be positive"
