baseURL: https://richardrh.github.io/valet/
languageCode: en-us
title: valet
enableGitInfo: true
enableRobotsTXT: true

module:
  hugoVersion:
    extended: true
    min: 0.146.0
  imports:
    - path: github.com/imfing/hextra

# Agent-readable outputs: /llms.txt (index), /llms-full.txt (every page as one
# Markdown file) and an index.md beside every page and section.
outputFormats:
  llmsfull:
    baseName: llms-full
    mediaType: text/plain
    isPlainText: true
    notAlternative: true

outputs:
  home: [html, rss, llms, llmsfull]
  page: [html, markdown]
  section: [html, rss, markdown]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /getting-started
      weight: 1
    - name: Concepts
      pageRef: /concepts
      weight: 2
    - name: Guides
      pageRef: /guides
      weight: 3
    - name: Rules
      pageRef: /rules
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      url: https://github.com/richardrh/valet
      weight: 6
      params:
        icon: github

params:
  description: A validation gate for data files before they reach your warehouse.
  navbar:
    displayTitle: true
    displayLogo: true
    width: wide
    logo:
      path: images/valet-mark.svg
      dark: images/valet-mark.svg
      link: /valet/
      width: 34
      height: 34
  page:
    width: wide
  footer:
    width: wide
    displayCopyright: false
    displayPoweredBy: false
  editURL:
    enable: true
    base: https://github.com/richardrh/valet/edit/main/docs/content
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
