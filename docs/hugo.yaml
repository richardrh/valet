baseURL: https://richardrh.github.io/valet/
languageCode: en-us
title: valet
enableGitInfo: true
enableRobotsTXT: true

module:
  hugoVersion:
    extended: true
    min: 0.146.0
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /getting-started
      weight: 1
    - name: Guides
      pageRef: /guides
      weight: 2
    - name: Rules
      pageRef: /rules
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      url: https://github.com/richardrh/valet
      weight: 5
      params:
        icon: github

params:
  description: A command-line data quality gate for local and S3-compatible files before ingestion.
  navbar:
    displayTitle: true
    displayLogo: true
    width: wide
    logo:
      path: images/valet-mark.svg
      dark: images/valet-mark.svg
      link: /valet/
      width: 34
      height: 34
  page:
    width: wide
  footer:
    width: wide
    displayCopyright: false
    displayPoweredBy: false
  editURL:
    enable: true
    base: https://github.com/richardrh/valet/edit/main/docs/content
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
