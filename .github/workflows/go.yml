name: CI

on:
  # Pull requests run through pull_request; pushing their branch would run CI
  # a second time. Main still runs after every merge and saves the caches.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_scale:
        description: Run the generated 100 GiB Arrow acceptance workload
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_scale:
        description: Run the generated 100 GiB Arrow acceptance workload
        type: boolean
        default: false

permissions:
  contents: read


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests that only touch documentation skip the Go and storage jobs;
  # CI result still reports success for them. Every other event runs all jobs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/content/**'
              - '!docs/layouts/**'
              - '!docs/assets/**'
              - '!docs/hugo.yaml'
              - '!docs/go.mod'
              - '!docs/go.sum'
              - '!docs/engineering/**'
              - '!**/*.md'
              - '!.github/workflows/docs.yml'

  quality:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: quality
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if test -n "$unformatted"; then
            printf 'gofmt required for:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: Race tests
        env:
          CGO_ENABLED: '1'
        run: go test -race ./internal/...
      - name: Scan reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/*.yml
      - uses: ./.github/actions/go-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: quality
          save: 'true'

  go-install:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: go-install
      - name: Install checkout
        env:
          GOBIN: ${{ runner.temp }}/valet-checkout
        run: go install ./cmd/valet
      - name: Exercise installed checkout
        env:
          VALET_BINARY: ${{ runner.temp }}/valet-checkout/valet
        run: go test -count=1 -tags integration ./integration -run '^TestStdout' -timeout 5m
      - name: Install published module tag
        if: github.ref_type == 'tag'
        env:
          GOBIN: ${{ runner.temp }}/valet-module
          INSTALL_VERSION: ${{ github.ref_name }}
        run: go install "github.com/richardrh/valet/cmd/valet@$INSTALL_VERSION"
      - name: Exercise installed module tag
        if: github.ref_type == 'tag'
        env:
          VALET_BINARY: ${{ runner.temp }}/valet-module/valet
        run: go test -count=1 -tags integration ./integration -run '^TestStdout' -timeout 5m
      - uses: ./.github/actions/go-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: go-install
          save: 'true'

  verify:
    needs: quality
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
            executable: valet
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            executable: valet
          - runner: windows-2025
            target: windows-amd64
            executable: valet.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: verify-${{ matrix.target }}
      - name: Unit tests
        run: go test ./...
      - name: Build self-contained CLI
        run: go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o 'dist/${{ matrix.executable }}' ./cmd/valet
      - name: Release executable reports stamped version
        run: test "$('./dist/${{ matrix.executable }}' --version | tr -d '\r')" = "valet $VERSION"
      - name: CLI acceptance scenarios against release executable
        # -count=1: Go's test cache does not see the external executable, so a
        # cached pass could hide a regression in a new build.
        run: VALET_BINARY="$PWD/dist/${{ matrix.executable }}" go test -count=1 -tags integration ./integration
      - uses: actions/upload-artifact@v4
        with:
          name: valet-${{ matrix.target }}
          path: dist/${{ matrix.executable }}
          if-no-files-found: error
      - uses: ./.github/actions/go-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: verify-${{ matrix.target }}
          save: 'true'

  darwin-cross-build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
      GOOS: darwin
      GOARCH: ${{ matrix.goarch }}
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: darwin-${{ matrix.goarch }}
      - name: Cross-build CLI (not executed; no macOS runner)
        run: go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o dist/valet ./cmd/valet
      - name: Compile darwin test binaries
        run: go test -tags integration -run '^$' -exec true ./...
      - uses: actions/upload-artifact@v4
        with:
          name: valet-darwin-${{ matrix.goarch }}
          path: dist/valet
          if-no-files-found: error
      - uses: ./.github/actions/go-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: darwin-${{ matrix.goarch }}
          save: 'true'

  s3-compatible:
    name: s3-compatible (${{ matrix.backend }})
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [minio, rustfs]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: s3-${{ matrix.backend }}
      - name: Cache MinIO server build
        if: matrix.backend == 'minio'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/minio-build
          # MinIO is built from a pinned commit; rebuild only when that pin or
          # the Go toolchain (go.mod) changes.
          key: minio-${{ hashFiles('.github/scripts/test-s3-compatible.sh', 'go.mod') }}
      - name: Real release and race CLI acceptance against container
        env:
          BACKEND: ${{ matrix.backend }}
          CONTAINER_RUNTIME: docker
          VALET_S3_LOG_DIR: ${{ runner.temp }}/s3-${{ matrix.backend }}
          MINIO_BUILD_DIR: ${{ runner.temp }}/minio-build
          TMPDIR: ${{ runner.temp }}
        run: bash .github/scripts/test-s3-compatible.sh "$BACKEND"
      - name: Upload backend acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-compatibility-${{ matrix.backend }}
          path: ${{ runner.temp }}/s3-${{ matrix.backend }}/
          if-no-files-found: warn
      - uses: ./.github/actions/go-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: s3-${{ matrix.backend }}
          save: 'true'

  generated-scale:
    needs: quality
    if: github.event_name == 'workflow_dispatch' && inputs.run_scale
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CGO_ENABLED: '0'
      VALET_SCALE_ARTIFACT: scale-result.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Generated Arrow scale acceptance
        run: go test -tags=scale ./benchmarks -run '^TestScale100GiB$' -timeout 0 -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-scale-result
          path: benchmarks/scale-result.json

  # The one required status check. It passes when every job passed, or when
  # the change is documentation-only and the Go jobs were skipped.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, quality, go-install, verify, darwin-cross-build, s3-compatible]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Required jobs passed or were skipped for a docs-only change
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$NEEDS" | jq -e --arg code "$CODE" '
            .changes.result == "success" and
            (del(.changes) | to_entries | all(
              .value.result == "success" or ($code != "true" and .value.result == "skipped")))'
