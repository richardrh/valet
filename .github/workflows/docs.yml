name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/cookbook/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
      - 'go.mod'
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/cookbook/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
      - 'go.mod'
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  configure-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

  build:
    needs: configure-pages
    if: ${{ !cancelled() && (needs.configure-pages.result == 'success' || needs.configure-pages.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.156.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            docs/go.sum
      - name: Install Hugo Extended
        working-directory: ${{ runner.temp }}
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          checksums="hugo_${HUGO_VERSION}_checksums.txt"
          release_url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          install_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location "$release_url/$archive" -o "$install_dir/$archive"
          curl --fail --silent --show-error --location "$release_url/$checksums" -o "$install_dir/$checksums"
          (
            cd "$install_dir"
            sha256sum --check --ignore-missing "$checksums"
          )
          sudo dpkg -i "$install_dir/$archive"
      - name: Restore Hugo module cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hugo-cache
          key: hugo-${{ runner.os }}-${{ hashFiles('docs/go.sum') }}
          restore-keys: |
            hugo-${{ runner.os }}-
      - name: Build site
        working-directory: docs
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo-cache
          PAGES_BASE_URL: ${{ needs.configure-pages.outputs.base_url }}
        run: |
          base_url="$PAGES_BASE_URL"
          if [[ -z "$base_url" ]]; then
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            repository="${GITHUB_REPOSITORY#*/}"
            base_url="https://${owner}.github.io"
            if [[ "${repository,,}" != "${owner}.github.io" ]]; then
              base_url="$base_url/$repository"
            fi
          fi
          hugo --gc --minify --baseURL "${base_url%/}/"
      - name: Upload Pages artifact
        if: needs.configure-pages.result == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
